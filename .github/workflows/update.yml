# Refreshes the free wire and ticker every 5 minutes, rebuilds whenever the
# newsroom run pushes new briefs, and turns each Morning Note into a pull request
# that must be merged (approved) before it publishes. Deploys to GitHub Pages.
name: Update site

on:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  # Briefs: if the desk could only push to claude/newsroom, fast-forward main to
  # it, then start a deploy on main (Pages only accepts deploys from main).
  promote:
    if: github.ref == 'refs/heads/claude/newsroom'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fast-forward main
        run: |
          git fetch origin claude/newsroom
          git merge --ff-only FETCH_HEAD
          git push origin HEAD:main
      - name: Deploy from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main --repo "$GITHUB_REPOSITORY"

  # Morning Note: never auto-published. Open (or refresh) a pull request for approval.
  note-approval:
    if: startsWith(github.ref, 'refs/heads/claude/note-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Open or refresh the approval pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          date="${BRANCH#claude/note-}"
          node scripts/note-pr.mjs "$date" > pr-body.md
          title="$(node scripts/note-pr.mjs "$date" --title)"
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file pr-body.md
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file pr-body.md
            # The account that pushed the note gets a review request, so GitHub emails the owner.
            gh pr edit "$BRANCH" --add-reviewer "$GITHUB_ACTOR" || echo "::warning::Could not request a review from $GITHUB_ACTOR"
          fi

  # Second check on the desk's commits: every evidence sentence must be on its source
  # page. An unreadable page is only a warning here (publishers block GitHub's runners
  # more often); a sentence missing from a readable page fails the run.
  source-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check evidence against the source pages
        run: node scripts/check-sources.mjs --since "${{ github.event.before }}" --ci

  # GitHub sometimes leaves a deploy "waiting" on the github-pages environment with no
  # reviewer or timer (30 Sep 2026: 3.5 hours). It holds the 'pages' slot, every later
  # deploy is cancelled and the wire freezes, so clear any run stuck like that.
  unstick:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Cancel deploys stuck waiting for more than 15 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          for id in $(gh run list -R "$REPO" --workflow update.yml --status waiting --limit 20 --json databaseId,createdAt --jq ".[] | select(.createdAt < \"$cutoff\") | .databaseId"); do
            echo "::warning::Cancelling run $id: its deploy has been waiting since before $cutoff"
            gh run cancel "$id" -R "$REPO" || gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" || true
          done

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Refresh wire and ticker
        env:
          WIRE_STATE_URL: ${{ steps.pages.outputs.base_url }}/data/wire.json
          TICKER_STATE_URL: ${{ steps.pages.outputs.base_url }}/data/ticker.json
        run: |
          node scripts/fetch-wire.mjs
          node scripts/fetch-ticker.mjs
      - name: Restore share cards
        uses: actions/cache@v4
        with:
          path: .cache/cards
          key: cards-v1-${{ hashFiles('content/**', 'scripts/cards.mjs', 'scripts/lib/util.mjs', 'config/site.json', 'config/sections.json') }}
          restore-keys: cards-v1-
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
