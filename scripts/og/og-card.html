<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Newsreader:ital,opsz,wght@1,6..72,500&family=Schibsted+Grotesk:wght@900&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  .card { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 0 72px; }
  .rule { position: absolute; left: 72px; right: 72px; top: 64px; border-top: 6px solid #0b0b0c; }
  .kicker { position: absolute; left: 72px; top: 96px; font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .12em; color: #b34700; text-transform: uppercase; }
  .mark { position: absolute; left: 72px; top: 206px; white-space: nowrap; color: #0b0b0c; font-size: 94px; line-height: 1; }
  .notes { font-family: 'Newsreader', serif; font-style: italic; font-weight: 500; letter-spacing: -.01em; }
  .terminal { font-family: 'Schibsted Grotesk', sans-serif; font-weight: 900; letter-spacing: -.035em; }
  .cursor { display: inline-block; width: .4em; height: .7em; margin-left: .08em; background: #ff8c1a; vertical-align: baseline; }
  .tagline { position: absolute; left: 72px; top: 352px; font: 500 30px 'IBM Plex Mono', monospace; letter-spacing: .06em; color: #5e5e66; text-transform: uppercase; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 128px; background: #0b0b0c; display: flex; align-items: center; justify-content: space-between; padding: 0 72px; box-sizing: border-box; font: 600 24px 'IBM Plex Mono', monospace; letter-spacing: .06em; }
  .beats { color: #ff9f1c; text-transform: uppercase; }
  .handle { color: #f4f4f5; }
</style></head>
<body><div class="card">
  <div class="rule"></div>
  <div class="kicker">Live · AI in finance</div>
  <div class="mark"><span class="notes">Notes from the</span> <span class="terminal">Terminal</span><span class="cursor"></span></div>
  <div class="tagline">Banks · Payments · SEA desk · Models</div>
  <div class="band"><span class="beats">Live wire · Morning Note</span><span class="handle">@0xNotMarc</span></div>
</div></body></html>
